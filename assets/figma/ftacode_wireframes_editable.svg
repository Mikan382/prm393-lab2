<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .wf-title { font-family: 'Nunito', 'Segoe UI', sans-serif; font-weight: 700; fill: #424242; }
      .wf-sub { font-family: 'Nunito', 'Segoe UI', sans-serif; font-weight: 400; fill: #757575; font-size: 13px; }
      .wf-box { fill: #FAFAFA; stroke: #BDBDBD; stroke-width: 1.5; }
      .wf-ph { fill: #EEEEEE; stroke: #BDBDBD; stroke-width: 1; }
      .wf-line { stroke: #BDBDBD; stroke-width: 1.5; }
      .wf-text { font-family: 'Nunito', 'Segoe UI', sans-serif; font-size: 11px; fill: #757575; }
    </style>
  </defs>

  <!-- Background Board -->
  <rect width="1600" height="900" fill="#F5F5F5" rx="24"/>

  <!-- Header -->
  <text x="50" y="50" class="wf-title" font-size="24">FtaCode Wireframes — 02 Wireframe Page (Low-Fidelity Architecture)</text>
  <text x="50" y="80" class="wf-sub">Low-Fidelity structural frames testing visual hierarchy, layout constraints &amp; ergonomics before high-fidelity styling</text>

  <!-- ================= SCREEN 1: ONBOARDING WIREFRAME ================= -->
  <g transform="translate(50, 110)">
    <rect width="340" height="740" rx="20" class="wf-box"/>
    <text x="20" y="35" class="wf-title" font-size="14">SCR-01: Onboarding Wireframe</text>
    
    <!-- Top badge & skip -->
    <rect x="20" y="55" width="120" height="24" rx="12" class="wf-ph"/>
    <rect x="270" y="55" width="50" height="24" rx="4" class="wf-ph"/>

    <!-- Hero Image Placeholder with X -->
    <rect x="20" y="100" width="300" height="220" rx="16" class="wf-ph"/>
    <line x1="20" y1="100" x2="320" y2="320" stroke="#BDBDBD" stroke-width="1"/>
    <line x1="320" y1="100" x2="20" y2="320" stroke="#BDBDBD" stroke-width="1"/>
    <text x="170" y="215" font-family="'Nunito', sans-serif" font-size="12" fill="#9E9E9E" text-anchor="middle">[Appetizing Hero Illustration]</text>

    <!-- Typography Placeholders -->
    <rect x="20" y="340" width="260" height="24" rx="4" class="wf-ph"/>
    <rect x="20" y="375" width="300" height="14" rx="4" class="wf-ph"/>
    <rect x="20" y="395" width="220" height="14" rx="4" class="wf-ph"/>

    <!-- 3 Value Proposition Cards -->
    <rect x="20" y="430" width="300" height="44" rx="8" class="wf-ph"/>
    <rect x="20" y="485" width="300" height="44" rx="8" class="wf-ph"/>
    <rect x="20" y="540" width="300" height="44" rx="8" class="wf-ph"/>

    <!-- Primary CTA -->
    <rect x="20" y="615" width="300" height="48" rx="12" fill="#757575"/>
    <text x="170" y="644" font-family="'Nunito', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">Bắt đầu đặt món ngay</text>
    
    <!-- Secondary link -->
    <rect x="50" y="680" width="240" height="18" rx="4" class="wf-ph"/>
  </g>

  <!-- ================= SCREEN 2: HOME WIREFRAME ================= -->
  <g transform="translate(420, 110)">
    <rect width="340" height="740" rx="20" class="wf-box"/>
    <text x="20" y="35" class="wf-title" font-size="14">SCR-02: Home Screen Wireframe</text>
    
    <!-- App Bar -->
    <rect x="20" y="55" width="160" height="28" rx="6" class="wf-ph"/>
    <circle cx="300" cy="69" r="16" class="wf-ph"/>

    <!-- Search Bar -->
    <rect x="20" y="95" width="300" height="44" rx="8" class="wf-ph"/>
    <text x="35" y="122" class="wf-text">Tìm kiếm món ăn...</text>

    <!-- Category Pills -->
    <rect x="20" y="150" width="65" height="32" rx="16" fill="#757575"/>
    <rect x="95" y="150" width="75" height="32" rx="16" class="wf-ph"/>
    <rect x="180" y="150" width="75" height="32" rx="16" class="wf-ph"/>
    <rect x="265" y="150" width="55" height="32" rx="16" class="wf-ph"/>

    <!-- Flash Deal Banner -->
    <rect x="20" y="195" width="300" height="90" rx="12" class="wf-ph"/>
    <line x1="20" y1="195" x2="320" y2="285" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Section Title -->
    <rect x="20" y="300" width="140" height="18" rx="4" class="wf-ph"/>

    <!-- Food Item Card 1 -->
    <rect x="20" y="330" width="300" height="95" rx="12" class="wf-ph"/>
    <rect x="30" y="340" width="75" height="75" rx="8" fill="#E0E0E0"/>
    <rect x="115" y="345" width="140" height="16" rx="4" fill="#BDBDBD"/>
    <rect x="115" y="370" width="80" height="12" rx="4" fill="#E0E0E0"/>
    <rect x="115" y="392" width="60" height="16" rx="4" fill="#9E9E9E"/>
    <circle cx="295" cy="395" r="14" fill="#757575"/>

    <!-- Food Item Card 2 -->
    <rect x="20" y="440" width="300" height="95" rx="12" class="wf-ph"/>
    <rect x="30" y="450" width="75" height="75" rx="8" fill="#E0E0E0"/>
    <rect x="115" y="455" width="140" height="16" rx="4" fill="#BDBDBD"/>
    <rect x="115" y="480" width="80" height="12" rx="4" fill="#E0E0E0"/>
    <rect x="115" y="502" width="60" height="16" rx="4" fill="#9E9E9E"/>
    <circle cx="295" cy="505" r="14" fill="#757575"/>

    <!-- Food Item Card 3 -->
    <rect x="20" y="550" width="300" height="95" rx="12" class="wf-ph"/>
    <rect x="30" y="560" width="75" height="75" rx="8" fill="#E0E0E0"/>
    <rect x="115" y="565" width="140" height="16" rx="4" fill="#BDBDBD"/>
    <rect x="115" y="590" width="80" height="12" rx="4" fill="#E0E0E0"/>
    <rect x="115" y="612" width="60" height="16" rx="4" fill="#9E9E9E"/>
    <circle cx="295" cy="615" r="14" fill="#757575"/>

    <!-- Bottom Navigation -->
    <rect x="0" y="675" width="340" height="65" rx="0" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
    <circle cx="45" cy="700" r="12" fill="#757575"/>
    <circle cx="130" cy="700" r="12" fill="#E0E0E0"/>
    <circle cx="215" cy="700" r="12" fill="#E0E0E0"/>
    <circle cx="295" cy="700" r="12" fill="#E0E0E0"/>
  </g>

  <!-- ================= SCREEN 3: FOOD DETAIL WIREFRAME ================= -->
  <g transform="translate(800, 110)">
    <rect width="340" height="740" rx="20" class="wf-box"/>
    <text x="20" y="35" class="wf-title" font-size="14">SCR-03: Food Detail Wireframe</text>

    <!-- Top Bar with Back & Heart -->
    <circle cx="35" cy="65" r="16" class="wf-ph"/>
    <rect x="100" y="55" width="140" height="20" rx="4" class="wf-ph"/>
    <circle cx="305" cy="65" r="16" class="wf-ph"/>

    <!-- Hero Image Placeholder -->
    <rect x="20" y="95" width="300" height="180" rx="14" class="wf-ph"/>
    <line x1="20" y1="95" x2="320" y2="275" stroke="#BDBDBD" stroke-width="1"/>
    <line x1="320" y1="95" x2="20" y2="275" stroke="#BDBDBD" stroke-width="1"/>

    <!-- Title & Price -->
    <rect x="20" y="290" width="200" height="22" rx="4" class="wf-ph"/>
    <rect x="20" y="320" width="100" height="18" rx="4" fill="#9E9E9E"/>
    <rect x="20" y="345" width="300" height="30" rx="4" class="wf-ph"/>

    <!-- Customization Group 1: Radio -->
    <rect x="20" y="390" width="140" height="16" rx="4" class="wf-ph"/>
    <rect x="20" y="415" width="300" height="36" rx="6" class="wf-ph"/>
    <rect x="20" y="460" width="300" height="36" rx="6" fill="#E0E0E0"/>

    <!-- Customization Group 2: Checkbox -->
    <rect x="20" y="510" width="120" height="16" rx="4" class="wf-ph"/>
    <rect x="20" y="535" width="300" height="36" rx="6" class="wf-ph"/>
    <rect x="20" y="580" width="300" height="36" rx="6" class="wf-ph"/>

    <!-- Sticky Bottom CTA -->
    <rect x="0" y="665" width="340" height="75" rx="0" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
    <rect x="20" y="680" width="90" height="44" rx="8" class="wf-ph"/>
    <rect x="125" y="680" width="195" height="44" rx="10" fill="#757575"/>
    <text x="220" y="707" font-family="'Nunito', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Thêm vào giỏ hàng</text>
  </g>

  <!-- ================= SCREEN 4: CART & ERROR WIREFRAME ================= -->
  <g transform="translate(1180, 110)">
    <rect width="340" height="740" rx="20" class="wf-box"/>
    <text x="20" y="35" class="wf-title" font-size="14">SCR-07: Error Recovery Wireframe</text>

    <!-- Top Bar -->
    <circle cx="35" cy="65" r="16" class="wf-ph"/>
    <rect x="80" y="55" width="180" height="20" rx="4" class="wf-ph"/>

    <!-- Error Alert Banner -->
    <rect x="20" y="95" width="300" height="110" rx="14" class="wf-ph"/>
    <circle cx="170" cy="130" r="18" fill="#BDBDBD"/>
    <rect x="60" y="160" width="220" height="16" rx="4" fill="#9E9E9E"/>
    <rect x="40" y="182" width="260" height="12" rx="4" class="wf-ph"/>

    <!-- Reassurance Countdown Card -->
    <rect x="20" y="220" width="300" height="50" rx="10" class="wf-ph"/>
    <text x="170" y="250" class="wf-text" text-anchor="middle">Đồng hồ giữ món: 09:45 (Giữ giỏ hàng)</text>

    <!-- Order Items Summary Box -->
    <rect x="20" y="285" width="300" height="100" rx="12" class="wf-ph"/>
    <rect x="35" y="300" width="160" height="14" rx="4" class="wf-ph"/>
    <rect x="35" y="325" width="120" height="14" rx="4" class="wf-ph"/>
    <rect x="35" y="355" width="270" height="18" rx="4" fill="#BDBDBD"/>

    <!-- Payment Switch Radios -->
    <rect x="20" y="405" width="180" height="16" rx="4" class="wf-ph"/>
    <rect x="20" y="430" width="300" height="50" rx="8" fill="#E0E0E0"/>
    <rect x="20" y="490" width="300" height="50" rx="8" class="wf-ph"/>
    <rect x="20" y="550" width="300" height="50" rx="8" class="wf-ph"/>

    <!-- Recovery CTAs -->
    <rect x="20" y="625" width="300" height="48" rx="10" fill="#757575"/>
    <text x="170" y="654" font-family="'Nunito', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">Thử lại bằng phương thức khác</text>

    <rect x="20" y="685" width="300" height="40" rx="8" class="wf-ph"/>
    <text x="170" y="710" class="wf-text" text-anchor="middle">Quay lại giỏ hàng</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .title { font-family: 'Nunito', 'Segoe UI', sans-serif; font-weight: 700; fill: #622B14; }
      .subtitle { font-family: 'Nunito', 'Segoe UI', sans-serif; font-weight: 400; fill: #966A55; font-size: 14px; }
      .lbl-bold { font-family: 'Nunito', 'Segoe UI', sans-serif; font-weight: 700; }
      .lbl-reg { font-family: 'Nunito', 'Segoe UI', sans-serif; font-weight: 400; }
    </style>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#622B14" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Board -->
  <rect width="1200" height="900" fill="#FFF5E5" rx="24"/>

  <!-- Header -->
  <text x="40" y="55" class="title" font-size="24">FtaCode Design System — 9 Reusable Components</text>
  <text x="40" y="85" class="subtitle">PRM323 Lab 2 • Tokens: #F69D39 (Primary), #622B14 (Text), #FFF5E5 (Bg), 48dp Touch Targets</text>

  <!-- ================= 1. BUTTONS ================= -->
  <g id="Component_01_Buttons" transform="translate(40, 110)">
    <text x="0" y="16" class="title" font-size="16">1. Button Variants &amp; States (Min height 48dp)</text>
    
    <!-- Default -->
    <g id="btn-default" transform="translate(0, 30)">
      <rect width="140" height="48" rx="12" fill="#F69D39" filter="url(#shadow1)"/>
      <text x="70" y="29" class="lbl-bold" font-size="14" fill="#FFFFFF" text-anchor="middle">Xác nhận</text>
      <text x="70" y="65" class="subtitle" font-size="11" text-anchor="middle">Default</text>
    </g>

    <!-- Pressed -->
    <g id="btn-pressed" transform="translate(160, 30)">
      <rect width="140" height="48" rx="12" fill="#E0851F"/>
      <text x="70" y="29" class="lbl-bold" font-size="14" fill="#FFFFFF" text-anchor="middle">Xác nhận</text>
      <text x="70" y="65" class="subtitle" font-size="11" text-anchor="middle">Pressed</text>
    </g>

    <!-- Disabled -->
    <g id="btn-disabled" transform="translate(320, 30)">
      <rect width="140" height="48" rx="12" fill="#EEDBCA"/>
      <text x="70" y="29" class="lbl-bold" font-size="14" fill="#A89080" text-anchor="middle">Xác nhận</text>
      <text x="70" y="65" class="subtitle" font-size="11" text-anchor="middle">Disabled</text>
    </g>

    <!-- Loading -->
    <g id="btn-loading" transform="translate(480, 30)">
      <rect width="140" height="48" rx="12" fill="#F69D39" filter="url(#shadow1)"/>
      <circle cx="45" cy="24" r="8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-dasharray="20 10"/>
      <text x="85" y="29" class="lbl-bold" font-size="13" fill="#FFFFFF">Đang xử lý…</text>
      <text x="70" y="65" class="subtitle" font-size="11" text-anchor="middle">Loading</text>
    </g>
  </g>

  <!-- ================= 2. TEXT FIELDS ================= -->
  <g id="Component_02_TextFields" transform="translate(680, 110)">
    <text x="0" y="16" class="title" font-size="16">2. Text Field States</text>

    <!-- Default -->
    <g id="tf-default" transform="translate(0, 30)">
      <rect width="220" height="48" rx="8" fill="#FFF9F0" stroke="#EEDBCA" stroke-width="1.5"/>
      <text x="14" y="29" class="lbl-reg" font-size="13" fill="#966A55">Nhập mã FTASV20…</text>
      <text x="110" y="65" class="subtitle" font-size="11" text-anchor="middle">Default / Placeholder</text>
    </g>

    <!-- Error State -->
    <g id="tf-error" transform="translate(240, 30)">
      <rect width="220" height="48" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="14" y="29" class="lbl-bold" font-size="13" fill="#DC2626">FTASV99 (!)</text>
      <text x="14" y="65" class="lbl-reg" font-size="11" fill="#DC2626">Mã giảm giá không hợp lệ</text>
    </g>
  </g>

  <!-- ================= 3. FOOD CARD & 4. BOTTOM NAV & 5. APP BAR ================= -->
  <g id="Component_03_Cards_Nav_Bar" transform="translate(40, 230)">
    <!-- 3. Food Card -->
    <g id="Component_Card" transform="translate(0, 0)">
      <text x="0" y="16" class="title" font-size="16">3. Food Item Card (Auto Layout)</text>
      
      <rect x="0" y="30" width="220" height="200" rx="16" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1" filter="url(#shadow1)"/>
      <!-- Food Image Box -->
      <rect x="12" y="42" width="196" height="100" rx="10" fill="#FFE8CC"/>
      <text x="110" y="98" class="lbl-bold" font-size="14" fill="#622B14" text-anchor="middle">🌮 Combo Tacos Bò</text>
      
      <!-- Food Info -->
      <text x="14" y="162" class="lbl-bold" font-size="14" fill="#622B14">Combo Tacos Phô Mai</text>
      <text x="14" y="180" class="subtitle" font-size="11">⚡ 3-5 phút • Thịt bò bắp</text>
      <text x="14" y="206" class="lbl-bold" font-size="15" fill="#F69D39">39.000đ</text>
      
      <!-- Quick add + button -->
      <circle cx="192" cy="202" r="16" fill="#F69D39"/>
      <text x="192" y="208" class="lbl-bold" font-size="18" fill="#FFFFFF" text-anchor="middle">+</text>
    </g>

    <!-- 5. App Bar -->
    <g id="Component_AppBar" transform="translate(260, 0)">
      <text x="0" y="16" class="title" font-size="16">5. Top App Bar (Campus Header)</text>
      
      <rect x="0" y="30" width="360" height="60" rx="12" fill="#FFF5E5" stroke="#EEDBCA" stroke-width="1"/>
      <circle cx="30" cy="60" r="18" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1"/>
      <text x="30" y="65" class="lbl-bold" font-size="16" fill="#622B14" text-anchor="middle">←</text>
      <text x="65" y="65" class="lbl-bold" font-size="15" fill="#622B14">Kiosk Tòa Alpha</text>
      
      <!-- Cart Icon Badge -->
      <rect x="305" y="42" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1"/>
      <text x="323" y="65" class="lbl-bold" font-size="14" fill="#622B14" text-anchor="middle">🛒</text>
      <circle cx="335" cy="44" r="8" fill="#F69D39"/>
      <text x="335" y="48" class="lbl-bold" font-size="10" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>

    <!-- 4. Bottom Navigation Bar -->
    <g id="Component_BottomNav" transform="translate(260, 120)">
      <text x="0" y="16" class="title" font-size="16">4. Bottom Navigation Bar (4 Destinations)</text>
      
      <rect x="0" y="30" width="360" height="64" rx="16" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1" filter="url(#shadow1)"/>
      
      <!-- Tab 1: Home (Active) -->
      <rect x="15" y="40" width="70" height="44" rx="12" fill="#FFE8CC"/>
      <text x="50" y="58" class="lbl-bold" font-size="14" fill="#F69D39" text-anchor="middle">🏠</text>
      <text x="50" y="74" class="lbl-bold" font-size="10" fill="#F69D39" text-anchor="middle">Trang chủ</text>

      <!-- Tab 2: Menu -->
      <text x="140" y="58" class="lbl-reg" font-size="14" fill="#966A55" text-anchor="middle">📋</text>
      <text x="140" y="74" class="lbl-reg" font-size="10" fill="#966A55" text-anchor="middle">Thực đơn</text>

      <!-- Tab 3: Orders -->
      <text x="230" y="58" class="lbl-reg" font-size="14" fill="#966A55" text-anchor="middle">📦</text>
      <text x="230" y="74" class="lbl-reg" font-size="10" fill="#966A55" text-anchor="middle">Đơn hàng</text>

      <!-- Tab 4: Profile -->
      <text x="315" y="58" class="lbl-reg" font-size="14" fill="#966A55" text-anchor="middle">👤</text>
      <text x="315" y="74" class="lbl-reg" font-size="10" fill="#966A55" text-anchor="middle">Cá nhân</text>
    </g>

    <!-- 6. Modal Dialog -->
    <g id="Component_Dialog" transform="translate(680, 0)">
      <text x="0" y="16" class="title" font-size="16">6. Confirmation &amp; Destructive Dialog</text>
      
      <rect x="0" y="30" width="280" height="154" rx="16" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1" filter="url(#shadow1)"/>
      <text x="20" y="60" class="lbl-bold" font-size="15" fill="#622B14">Xác nhận hủy đơn hàng?</text>
      <text x="20" y="85" class="lbl-reg" font-size="12" fill="#966A55">Bếp chưa chế biến. Số tiền sẽ được</text>
      <text x="20" y="103" class="lbl-reg" font-size="12" fill="#966A55">hoàn lại tài khoản ví trong 30 giây.</text>
      
      <!-- Actions -->
      <rect x="110" y="126" width="75" height="36" rx="8" fill="#FFF5E5"/>
      <text x="147" y="149" class="lbl-reg" font-size="12" fill="#622B14" text-anchor="middle">Giữ đơn</text>

      <rect x="195" y="126" width="70" height="36" rx="8" fill="#DC2626"/>
      <text x="230" y="149" class="lbl-bold" font-size="12" fill="#FFFFFF" text-anchor="middle">Hủy đơn</text>
    </g>
  </g>

  <!-- ================= 7. LOADING, 8. EMPTY, 9. ERROR ================= -->
  <g id="Component_States_Row" transform="translate(40, 500)">
    <!-- 7. Loading Skeleton -->
    <g id="Component_Loading" transform="translate(0, 0)">
      <text x="0" y="16" class="title" font-size="16">7. Loading State (Skeleton Shimmer)</text>
      
      <rect x="0" y="30" width="220" height="180" rx="16" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1"/>
      <rect x="14" y="44" width="192" height="90" rx="10" fill="#F0E5D8"/>
      <rect x="14" y="148" width="130" height="14" rx="4" fill="#F0E5D8"/>
      <rect x="14" y="170" width="70" height="14" rx="4" fill="#F0E5D8"/>
      <circle cx="190" cy="177" r="14" fill="#F0E5D8"/>
    </g>

    <!-- 8. Empty State -->
    <g id="Component_Empty" transform="translate(260, 0)">
      <text x="0" y="16" class="title" font-size="16">8. Empty State (Empty Cart / Menu)</text>
      
      <rect x="0" y="30" width="280" height="180" rx="16" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1" filter="url(#shadow1)"/>
      <text x="140" y="80" font-size="32" text-anchor="middle">🍽️</text>
      <text x="140" y="112" class="lbl-bold" font-size="15" fill="#622B14" text-anchor="middle">Giỏ hàng của bạn đang đói 🌮</text>
      <text x="140" y="132" class="lbl-reg" font-size="11" fill="#966A55" text-anchor="middle">Hãy chọn món ngon để nạp năng lượng nhé!</text>
      <rect x="50" y="150" width="180" height="38" rx="10" fill="#F69D39"/>
      <text x="140" y="174" class="lbl-bold" font-size="12" fill="#FFFFFF" text-anchor="middle">Khám phá thực đơn</text>
    </g>

    <!-- 9. Error State -->
    <g id="Component_Error" transform="translate(580, 0)">
      <text x="0" y="16" class="title" font-size="16">9. Error State &amp; Recovery</text>
      
      <rect x="0" y="30" width="380" height="180" rx="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" filter="url(#shadow1)"/>
      <text x="190" y="75" font-size="32" text-anchor="middle">⚠️</text>
      <text x="190" y="105" class="lbl-bold" font-size="15" fill="#DC2626" text-anchor="middle">Chưa thể hoàn tất thanh toán</text>
      <text x="190" y="125" class="lbl-reg" font-size="11" fill="#966A55" text-anchor="middle">Ví điện tử timeout. Giỏ hàng của bạn vẫn được giữ nguyên!</text>
      
      <!-- Recovery Buttons -->
      <rect x="25" y="145" width="200" height="40" rx="8" fill="#F69D39"/>
      <text x="125" y="170" class="lbl-bold" font-size="11" fill="#FFFFFF" text-anchor="middle">Chuyển sang trả tiền mặt tại Kiosk</text>

      <rect x="240" y="145" width="115" height="40" rx="8" fill="#FFFFFF" stroke="#622B14" stroke-width="1"/>
      <text x="297" y="170" class="lbl-reg" font-size="11" fill="#622B14" text-anchor="middle">Thử lại online</text>
    </g>
  </g>

  <!-- Color Tokens Legend Footer -->
  <g id="Tokens_Legend" transform="translate(40, 750)">
    <rect width="1120" height="110" rx="16" fill="#FFFFFF" stroke="#EEDBCA" stroke-width="1"/>
    <text x="24" y="35" class="title" font-size="15">🎨 FtaCode Design Tokens (Variables Mapping):</text>
    
    <circle cx="34" cy="70" r="14" fill="#F69D39"/>
    <text x="56" y="66" class="lbl-bold" font-size="12" fill="#622B14">Primary: #F69D39</text>
    <text x="56" y="82" class="lbl-reg" font-size="10" fill="#966A55">Main CTA &amp; Accent</text>

    <circle cx="214" cy="70" r="14" fill="#622B14"/>
    <text x="236" y="66" class="lbl-bold" font-size="12" fill="#622B14">Text: #622B14</text>
    <text x="236" y="82" class="lbl-reg" font-size="10" fill="#966A55">High Contrast AAA</text>

    <circle cx="394" cy="70" r="14" fill="#FFF5E5" stroke="#EEDBCA" stroke-width="1"/>
    <text x="416" y="66" class="lbl-bold" font-size="12" fill="#622B14">Background: #FFF5E5</text>
    <text x="416" y="82" class="lbl-reg" font-size="10" fill="#966A55">Warm Cream Canvas</text>

    <circle cx="614" cy="70" r="14" fill="#16A34A"/>
    <text x="636" y="66" class="lbl-bold" font-size="12" fill="#622B14">Success: #16A34A</text>
    <text x="636" y="82" class="lbl-reg" font-size="10" fill="#966A55">Order Ready &amp; Vouchers</text>

    <circle cx="814" cy="70" r="14" fill="#DC2626"/>
    <text x="836" y="66" class="lbl-bold" font-size="12" fill="#622B14">Error: #DC2626</text>
    <text x="836" y="82" class="lbl-reg" font-size="10" fill="#966A55">Alerts &amp; Cancellations</text>
  </g>
</svg>
